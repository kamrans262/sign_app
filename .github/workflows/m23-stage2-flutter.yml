name: M23 Stage 2 Flutter Stripe Billing
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m23-stage2-flutter
  cancel-in-progress: true
jobs:
  billing-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Strict subscription source and test analysis
        run: dart analyze --fatal-infos lib/features/subscription test/features/subscription
      - name: Real company and fake Stripe checkout, navigation, cancellation, error flows
        run: |
          timeout --signal=TERM --kill-after=10s 600s flutter test --no-pub --concurrency=2 --timeout=75s --reporter=expanded test/features/subscription
      - name: M22 security and M21 search regressions
        run: |
          timeout --signal=TERM --kill-after=10s 450s flutter test --no-pub --concurrency=2 --timeout=75s test/features/profile test/features/global_search
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Android debug compile without Stripe credentials, signing or deployment
        run: |
          timeout --signal=TERM --kill-after=10s 1500s flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk
