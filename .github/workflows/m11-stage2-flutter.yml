name: M11 Stage 2 regression and mobile compilation
on:
  push:
    branches: [feature/m11-job-photos-notes-2026-11-04]
    paths:
      - '.github/workflows/m11-stage2-flutter.yml'
      - 'lib/features/jobs/**'
      - 'lib/core/services/sign_api_client.dart'
      - 'lib/features/quotes/**'
      - 'lib/features/documents/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/features/jobs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign2digital-m11-stage2-flutter
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze M11 repository and source screens
        run: |
          flutter analyze --no-pub lib/core/services/sign_api_client.dart lib/features/jobs lib/features/documents/data/remote_document_repository.dart lib/features/quotes/services/remote_quote_preparation_service.dart test/features/jobs
      - name: Verify photo, note, job, quote, signature, documents and addenda regressions
        run: |
          flutter test --no-pub --concurrency=2 --timeout=2m --reporter=expanded test/features/jobs test/features/quotes/m6_remote_quote_repository_test.dart test/features/quotes/m7_approved_pdf_download_test.dart test/features/quotes/m8_remote_signature_request_test.dart test/features/documents/m8_signed_document_repository_test.dart test/features/documents/m9_remote_document_repository_test.dart test/features/documents/m10_remote_addendum_repository_test.dart test/features/documents/m10_addendum_responsive_test.dart

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Android debug compile (no signing or publishing)
        run: flutter build apk --debug --no-pub
      - run: test -s build/app/outputs/flutter-apk/app-debug.apk

  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: iOS Simulator debug compile (no signing or publishing)
        run: flutter build ios --simulator --debug --no-codesign --no-pub
