name: M15 Stage 1 Flutter Time and Labour
on:
  push:
    branches: [feature/m12-site-reports-meeting-minutes-2026-11-04]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign2digital-m15-flutter
  cancel-in-progress: true
jobs:
  labour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze M15 model, repo, widgets and existing labour screens
        run: |
          dart analyze lib/features/labour lib/features/jobs/presentation/screens/job_details_screen.dart test/features/labour/m15_remote_labour_repository_test.dart test/features/labour/m15_live_timer_widget_test.dart
      - name: M15 API contract and persistent timer widget
        run: |
          flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/labour/m15_remote_labour_repository_test.dart test/features/labour/m15_live_timer_widget_test.dart
      - name: M15 existing labour screens and voice draft
        run: |
          flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/labour/time_labour_screen_test.dart test/features/labour/create_labour_entry_screen_test.dart test/features/labour/labour_entry_details_screen_test.dart
      - name: M15 Job Details and M14 expense regression
        run: |
          flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/jobs/job_details_screen_test.dart test/features/expenses/m14_remote_expense_repository_test.dart
