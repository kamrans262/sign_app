name: Sign2Digital More Production Data Regression
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign2digital-more-live-data
  cancel-in-progress: true
jobs:
  real-module-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Strict analysis of production More, AI Documents and Reports
        run: |
          dart analyze --fatal-infos lib/features/clients/presentation/screens/more_screen.dart lib/features/documents/presentation/screens/ai_documents_screen.dart lib/features/documents/presentation/screens/reports_screen.dart
      - name: Verify production More menu and non-demo document behavior
        run: |
          timeout --signal=TERM --kill-after=10s 360s flutter test --no-pub --concurrency=2 --timeout=90s --reporter=expanded test/features/clients/more_live_modules_test.dart test/features/documents/ai_documents_screen_test.dart test/features/documents/reports_screen_test.dart test/features/subscription/subscription_overview_screen_test.dart test/features/reminders/reminders_module_test.dart
