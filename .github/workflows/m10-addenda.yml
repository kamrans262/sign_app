name: M10 Addenda Stage 1 Flutter verification

on:
  push:
    branches: [feature/m10-addenda-management-2026-11-04]
    paths:
      - '.github/workflows/m10-addenda.yml'
      - 'lib/features/documents/**'
      - 'lib/features/quotes/data/remote_quote_repository.dart'
      - 'lib/core/services/sign_api_client.dart'
      - 'test/features/documents/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign2digital-m10-flutter
  cancel-in-progress: true

jobs:
  m10-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze live M10 documents and original screens
        run: |
          flutter analyze --no-pub lib/features/documents/data/remote_addendum_repository.dart lib/features/documents/domain/addendum_draft.dart lib/features/documents/services/addendum_voice_extraction_service.dart lib/features/documents/presentation/screens/create_addendum_screen.dart lib/features/documents/presentation/screens/document_details_screen.dart lib/features/documents/presentation/screens/documents_screen.dart lib/features/documents/data/remote_document_repository.dart test/features/documents/m10_remote_addendum_repository_test.dart
      - name: Check M10 persistence and M9 signed document regressions
        run: flutter test --no-pub --concurrency=2 --timeout=2m --reporter=expanded test/features/documents/m10_remote_addendum_repository_test.dart test/features/documents/m9_previous_quote_preview_test.dart test/features/documents/m9_remote_document_repository_test.dart test/features/documents/m8_signed_document_repository_test.dart test/features/documents/phase5_addendum_flow_test.dart
