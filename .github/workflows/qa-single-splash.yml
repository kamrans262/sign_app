name: Sign2Digital Single Splash QA
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/qa-single-splash.yml'
      - 'lib/main.dart'
      - 'lib/features/splash/presentation/splash_screen.dart'
      - 'pubspec.yaml'
      - 'tool/normalize_android_native_splash.dart'
      - 'tool/generate_android12_square_splash.dart'
      - 'assets/logo_splash_android12.png'
      - 'android/app/src/main/res/values-v31/styles.xml'
      - 'android/app/src/main/res/values-night-v31/styles.xml'
      - 'test/features/splash/splash_navigation_test.dart'
      - 'test/widget_test.dart'
      - 'ios/Runner/Base.lproj/LaunchScreen.storyboard'
      - 'ios/Runner/Assets.xcassets/LaunchImage.imageset/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign-single-splash-qa
  cancel-in-progress: true
jobs:
  single-splash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify checked-in iOS splash matches Android artwork
        run: |
          cmp ios/Runner/Assets.xcassets/LaunchImage.imageset/LaunchImage.png android/app/src/main/res/drawable-mdpi/android12splash.png
          cmp ios/Runner/Assets.xcassets/LaunchImage.imageset/LaunchImage@2x.png android/app/src/main/res/drawable-xhdpi/android12splash.png
          cmp ios/Runner/Assets.xcassets/LaunchImage.imageset/LaunchImage@3x.png android/app/src/main/res/drawable-xxhdpi/android12splash.png
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('ios/Runner/Base.lproj/LaunchScreen.storyboard').getroot()
          view = root.find('.//imageView')
          assert view.attrib['image'] == 'LaunchImage'
          assert view.attrib['contentMode'] == 'scaleAspectFit'
          constraints = root.findall('.//constraint')
          for attr in ('width', 'height'):
              assert any(c.get('firstItem') == view.get('id') and c.get('firstAttribute') == attr and c.get('constant') == '288' for c in constraints)
          for attr in ('centerX', 'centerY'):
              assert any(c.get('firstItem') == view.get('id') and c.get('firstAttribute') == attr and c.get('secondAttribute') == attr for c in constraints)
          assert any(all(c.get(k) == '1' for k in ('red','green','blue','alpha')) for c in root.findall('.//color') if c.get('key') == 'backgroundColor')
          PY
      - name: Create Android 12 square logo with preserved proportions
        run: dart run tool/generate_android12_square_splash.dart
      - name: Analyze splash startup
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/main.dart lib/features/splash/presentation/splash_screen.dart test/features/splash/splash_navigation_test.dart test/widget_test.dart
      - name: Verify one splash and unchanged desktop flow
        run: flutter test --no-pub test/features/splash/splash_navigation_test.dart test/widget_test.dart
      - name: Generate branded native splash for Android 12 and older Android
        run: dart run flutter_native_splash:create
      - name: Ensure native Android 12+ white transition
        run: dart run tool/normalize_android_native_splash.dart
      - name: Verify Android 12 logo is square, and no app icon is used as splash source
        run: |
          file assets/logo_splash_android12.png | grep -q '1152 x 1152'
          file android/app/src/main/res/drawable-mdpi/android12splash.png | grep -q '288 x 288'
          grep -q 'image: "assets/logo_splash_android12.png"' pubspec.yaml
          if sed -n '/^flutter_native_splash:/,$p' pubspec.yaml | grep -q 'image: "assets/sign_app_icon.png"'; then exit 1; fi
          test -f android/app/src/main/res/values-v31/styles.xml
          grep -q 'windowSplashScreenAnimatedIcon' android/app/src/main/res/values-v31/styles.xml
          if grep -R -e 'Theme.Black.NoTitleBar' -e '?android:colorBackground' android/app/src/main/res/values-v31/styles.xml android/app/src/main/res/values-night-v31/styles.xml; then exit 1; fi
          grep -q 'launch_background' android/app/src/main/res/values/styles.xml
