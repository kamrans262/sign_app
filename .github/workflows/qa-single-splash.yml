name: Sign2Digital Single Splash QA
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/qa-single-splash.yml'
      - 'lib/main.dart'
      - 'lib/features/splash/presentation/splash_screen.dart'
      - 'pubspec.yaml'
      - 'tool/normalize_android_native_splash.dart'
      - 'android/app/src/main/res/values-v31/styles.xml'
      - 'android/app/src/main/res/values-night-v31/styles.xml'
      - 'test/features/splash/splash_navigation_test.dart'
      - 'test/widget_test.dart'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign-single-splash-qa
  cancel-in-progress: true
jobs:
  single-splash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze splash startup
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/main.dart lib/features/splash/presentation/splash_screen.dart test/features/splash/splash_navigation_test.dart test/widget_test.dart
      - name: Verify one splash and unchanged desktop flow
        run: flutter test --no-pub test/features/splash/splash_navigation_test.dart test/widget_test.dart
      - name: Generate branded native splash for Android 12 and older Android
        run: dart run flutter_native_splash:create
      - name: Ensure native Android 12+ white transition
        run: dart run tool/normalize_android_native_splash.dart
      - name: Verify Android 12 launch icon is generated and no app icon is used as splash source
        run: |
          grep -q 'image: "assets/logo_splash.png"' pubspec.yaml
          if sed -n '/^flutter_native_splash:/,$p' pubspec.yaml | grep -q 'image: "assets/sign_app_icon.png"'; then exit 1; fi
          test -f android/app/src/main/res/values-v31/styles.xml
          grep -q 'windowSplashScreenAnimatedIcon' android/app/src/main/res/values-v31/styles.xml
          if grep -R -e 'Theme.Black.NoTitleBar' -e '?android:colorBackground' android/app/src/main/res/values-v31/styles.xml android/app/src/main/res/values-night-v31/styles.xml; then exit 1; fi
          grep -q 'launch_background' android/app/src/main/res/values/styles.xml
