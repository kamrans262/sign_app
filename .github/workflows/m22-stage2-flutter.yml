name: M22 Stage 2 Flutter Security UI and Android Build
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m22-stage2-flutter
  cancel-in-progress: true

jobs:
  ui-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Strict analysis of profile and security surfaces
        run: |
          dart analyze --fatal-infos lib/features/profile lib/features/auth/data/mobile_auth_repository.dart lib/features/auth/data/remote_account_repository.dart lib/core/services/sign_api_client.dart test/features/profile/m22_stage2_landscape_acceptance_test.dart lib/features/auth/presentation/screens/two_factor_login_screen.dart test/features/auth/two_factor_auth_test.dart
      - name: Stage 1 and Stage 2 screen and security integration tests
        run: |
          timeout --signal=TERM --kill-after=10s 480s flutter test --no-pub --concurrency=2 --timeout=75s --reporter=expanded test/features/profile test/core/widgets/sign2digital_field_icon_visibility_test.dart test/features/auth/mobile_auth_repository_test.dart test/features/auth/two_factor_auth_test.dart
      - name: M21 global search UI regression
        run: |
          timeout --signal=TERM --kill-after=10s 300s flutter test --no-pub --concurrency=2 --timeout=60s test/features/global_search

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate one branded Android native launch splash
        run: dart run flutter_native_splash:create
      - name: Android compile smoke — no signing, release or deployment
        run: |
          timeout --signal=TERM --kill-after=10s 1500s flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk
