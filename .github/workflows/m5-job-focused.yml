name: M5 Job Management focused Flutter verification

on:
  push:
    branches:
      - feature/m5-job-management-2026-11-03
    paths:
      - '.github/workflows/m5-job-focused.yml'
      - 'lib/features/jobs/**'
      - 'lib/features/clients/presentation/screens/clients_screen.dart'
      - 'lib/features/clients/presentation/screens/client_details_screen.dart'
      - 'lib/features/home/presentation/screens/home_dashboard_screen.dart'
      - 'test/features/jobs/**'
      - 'test/features/clients/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign2digital-m5-flutter
  cancel-in-progress: true

jobs:
  m5-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze only changed M5 Flutter source and test
        run: flutter analyze --no-pub lib/features/jobs/data/remote_job_repository.dart lib/features/jobs/domain/job_model.dart lib/features/jobs/domain/job_details_model.dart lib/features/jobs/presentation/screens/jobs_screen.dart lib/features/jobs/presentation/screens/create_job_screen.dart lib/features/jobs/presentation/screens/job_details_screen.dart lib/features/jobs/presentation/widgets/sign2digital_job_financial_card.dart lib/features/jobs/presentation/widgets/sign2digital_remaining_balance_card.dart lib/features/clients/presentation/screens/clients_screen.dart lib/features/clients/presentation/screens/client_details_screen.dart lib/features/home/presentation/screens/home_dashboard_screen.dart test/features/jobs/m5_remote_job_repository_test.dart test/features/jobs/m5_stage2_release_test.dart
      - name: Focused M5 repository, Jobs UI and M4 regression tests
        run: flutter test --no-pub --concurrency=1 test/features/jobs/m5_remote_job_repository_test.dart test/features/jobs/m5_stage2_release_test.dart test/features/jobs/jobs_screen_test.dart test/features/jobs/create_job_screen_test.dart test/features/jobs/job_details_screen_test.dart test/features/clients/clients_screen_test.dart test/features/clients/client_details_screen_test.dart test/features/jobs/phase1_client_job_flow_test.dart
