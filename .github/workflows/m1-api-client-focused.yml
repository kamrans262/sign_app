name: M1 Flutter API foundation focused verification

on:
  push:
    branches:
      - feature/m1-api-foundation-2026-11-03
    paths:
      - '.github/workflows/m1-api-client-focused.yml'
      - 'lib/core/services/sign_api_client.dart'
      - 'test/core/sign_api_client_test.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-m1-api-focused
  cancel-in-progress: true

jobs:
  api-client-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run only M1 API client tests
        run: timeout 180s flutter test --no-pub --concurrency=1 test/core/sign_api_client_test.dart
