name: Deposit Details focused verification

on:
  push:
    branches: [ui-development]
    paths:
      - '.github/workflows/deposit-details-focused-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  details-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Targeted analysis
        run: |
          flutter analyze --no-pub \
            lib/features/deposits \
            test/features/deposits/deposit_details_screen_test.dart \
            lib/features/invoices/presentation/screens/invoice_details_screen.dart \
            test/features/invoices/invoice_details_screen_test.dart
      - name: Deposit Details widget tests
        run: |
          timeout 170s flutter test --no-pub --concurrency=1 \
            --reporter expanded --timeout 35s \
            test/features/deposits/deposit_details_screen_test.dart
      - name: Invoice Details widget tests only
        if: always()
        run: |
          timeout 150s flutter test --no-pub --concurrency=1 \
            --reporter expanded --timeout 35s \
            test/features/invoices/invoice_details_screen_test.dart
