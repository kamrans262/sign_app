name: M4 Stage 2 Android contacts native compile

on:
  push:
    branches:
      - feature/m4-client-management-2026-11-03
    paths:
      - '.github/workflows/m4-stage2-android-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2d-m4-native
  cancel-in-progress: true

jobs:
  android-contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Compile Android debug APK with contacts plugin
        run: flutter build apk --debug --no-pub
