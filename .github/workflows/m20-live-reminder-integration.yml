name: M20 Live Reminder Integration Verification
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze live reminder and push navigation changes
        run: |
          dart analyze --fatal-infos lib/features/reminders
          dart analyze --fatal-infos lib/features/clients/presentation/screens/more_screen.dart
      - name: Verify real API selection and preserve existing UI regression tests
        run: timeout --signal=TERM --kill-after=10s 250s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/reminders/reminders_module_test.dart test/features/reminders/m20_remote_reminders_notifications_test.dart test/features/reminders/m20_push_api_test.dart
