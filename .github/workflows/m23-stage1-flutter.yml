name: M23 Stage 1 Flutter Subscription and Billing
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m23-stage1-flutter
  cancel-in-progress: true

jobs:
  subscription-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Strict analysis of billing models, real API and approved screens
        run: |
          dart analyze --fatal-infos lib/features/subscription test/features/subscription
      - name: M23 remote company security and existing UI acceptance
        run: |
          timeout --signal=TERM --kill-after=10s 560s flutter test --no-pub --concurrency=2 --timeout=75s --reporter=expanded test/features/subscription
      - name: Existing M22 profile and M21 search regressions
        run: |
          timeout --signal=TERM --kill-after=10s 400s flutter test --no-pub --concurrency=2 --timeout=75s test/features/profile test/features/global_search

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile Android debug without signing, Firebase activation or release
        run: |
          timeout --signal=TERM --kill-after=10s 1500s flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk
