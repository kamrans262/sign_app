name: M25 SDK lint repair preview (read-only)
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths: ['.github/workflows/m25-lint-repair-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate compiler-proposed syntax-only changes (no push)
        run: |
          dart fix --apply --code=curly_braces_in_flow_control_structures,prefer_interpolation_to_compose_strings,use_null_aware_elements,unnecessary_brace_in_string_interps,prefer_adjacent_string_concatenation
          echo 'M25_PATCH_BEGIN'
          git diff --no-ext-diff --no-color -- lib test
          echo 'M25_PATCH_END'
      - name: Verify proposed changes
        run: python3 tool/m25_strict_analyze.py lib test
