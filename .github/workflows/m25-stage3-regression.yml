name: M25 Stage 3 full mobile regression and compile checks
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'ios/**'
      - 'android/**'
      - 'pubspec.*'
      - 'tool/**'
      - '.github/workflows/m25-stage3-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m25-stage3-mobile
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version && flutter pub get
      - name: Full analysis
        run: python3 tool/m25_strict_analyze.py lib test
      - name: All widget and unit tests
        if: ${{ !cancelled() }}
        run: flutter test --no-pub --concurrency=4 --reporter=expanded
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub
      - run: test -s build/app/outputs/flutter-apk/app-debug.apk
  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: SDK versions
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version
      - name: Generate compile-only Firebase plist if local file is absent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          path = Path('ios/Runner/GoogleService-Info.plist')
          if not path.exists():
              path.write_bytes(plistlib.dumps({'BUNDLE_ID':'com.sign2digital.app','PROJECT_ID':'compile-only-invalid','GOOGLE_APP_ID':'1:000000000000:ios:0000000000000000000000','GCM_SENDER_ID':'000000000000','API_KEY':'compile-only-not-a-real-key','IS_SIGNIN_ENABLED':False}))
          PY
      - run: flutter pub get
      - name: Unsigned release compilation (not an App Store archive)
        run: flutter build ios --release --no-codesign --no-pub
      - name: Check compiled bundle and app privacy resource
        run: |
          test -d build/ios/iphoneos/Runner.app
          test -f build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist
          find build/ios/iphoneos/Runner.app -name PrivacyInfo.xcprivacy -print
