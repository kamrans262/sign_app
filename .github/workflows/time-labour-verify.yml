name: Time and Labour focused UI verification

on:
  push:
    branches:
      - fix/m20-android-live-reminder-integration-2026-11-06
    paths:
      - '.github/workflows/time-labour-verify.yml'
      - 'lib/features/labour/**'
      - 'test/features/labour/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  time-labour-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out feature
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze Time and Labour feature only
        run: flutter analyze --no-pub --no-fatal-infos lib/features/labour/presentation/screens/time_labour_screen.dart lib/features/labour/presentation/screens/add_labour_entry_screen.dart test/features/labour/time_labour_screen_test.dart
      - name: Run Time and Labour responsive widget tests only
        run: flutter test --no-pub --concurrency=2 --reporter expanded --timeout 60s test/features/labour/time_labour_screen_test.dart test/features/labour/create_labour_entry_screen_test.dart test/features/labour/labour_entry_details_screen_test.dart
