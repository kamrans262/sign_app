name: M19 Stage 2 Flutter Overdue Reminders
on:
  push:
    branches: [feature/m12-site-reports-meeting-minutes-2026-11-04]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign2digital-m19-stage2-flutter
  cancel-in-progress: true
jobs:
  reminder-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: M19 and M20 adapter static analysis
        run: |
          dart analyze --no-fatal-warnings lib/features/equipment
          dart analyze --no-fatal-warnings lib/features/reminders
          dart analyze --no-fatal-warnings test/features/equipment
      - name: Real preview, confirmation, transport receipt and opt-in widget tests
        run: |
          timeout --signal=TERM --kill-after=10s 210s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/equipment/m19_equipment_reminder_stage2_test.dart
      - name: Equipment and Reminders original screen regressions
        run: |
          timeout --signal=TERM --kill-after=10s 240s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/equipment/m19_equipment_loan_integration_test.dart test/features/equipment/equipment_module_test.dart test/features/reminders/reminders_module_test.dart
      - name: M16-M18 functional regressions without missing M17 screenshot goldens
        run: |
          timeout --signal=TERM --kill-after=10s 240s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/documents/m18_issued_document_repository_test.dart test/features/deposits test/features/invoices/m17_remote_invoice_repository_test.dart test/features/invoices/m17_issued_pdf_delivery_test.dart
