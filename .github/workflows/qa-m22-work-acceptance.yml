name: M22 Work Acceptance Photos & Signature QA

on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/qa-m22-work-acceptance.yml'
      - 'lib/features/documents/presentation/screens/work_acceptance_editor_screen.dart'
      - 'lib/features/documents/presentation/screens/work_acceptance_screen.dart'
      - 'test/features/documents/m22_work_acceptance_photos_test.dart'
      - 'test/features/documents/work_acceptance_screen_test.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m22-work-acceptance-flutter
  cancel-in-progress: true

jobs:
  focused-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze affected files and tests
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/features/documents/presentation/screens/work_acceptance_editor_screen.dart lib/features/documents/presentation/screens/work_acceptance_screen.dart test/features/documents/m22_work_acceptance_photos_test.dart test/features/documents/work_acceptance_screen_test.dart
      - name: Test camera/gallery, preview layout, save/reopen and signature visibility
        run: |
          flutter test --no-pub --concurrency=2 --timeout=2m --reporter=expanded test/features/documents/m22_work_acceptance_photos_test.dart test/features/documents/work_acceptance_screen_test.dart test/features/documents/m13_remote_work_acceptance_repository_test.dart
