name: M4 Client Management focused verification

on:
  push:
    branches:
      - feature/m4-client-management-2026-11-03
    paths:
      - '.github/workflows/m4-client-focused.yml'
      - 'pubspec.yaml'
      - 'lib/features/clients/**'
      - 'lib/features/auth/data/mobile_auth_repository.dart'
      - 'lib/core/services/active_company_session.dart'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'ios/Runner/Info.plist'
      - 'test/features/clients/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2d-m4-flutter
  cancel-in-progress: true

jobs:
  m4-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze M4 touched client files only
        run: flutter analyze --no-pub lib/features/clients/data/remote_client_repository.dart lib/features/clients/data/device_phone_contact_source.dart lib/features/clients/presentation/screens/clients_screen.dart lib/features/clients/presentation/screens/add_client_screen.dart lib/features/clients/presentation/screens/client_details_screen.dart lib/features/clients/presentation/screens/import_clients_screen.dart test/features/clients/remote_client_repository_test.dart
      - name: Focused M4 UI/API regressions
        run: flutter test --no-pub --concurrency=1 test/features/clients/remote_client_repository_test.dart test/features/clients/import_clients_screen_test.dart test/features/clients/add_client_screen_test.dart test/features/clients/clients_screen_test.dart test/features/clients/client_details_screen_test.dart
