name: Invoice Details one-shot verification
on:
  push:
    branches: [ui-development, fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/invoice-details-one-shot-verify.yml'
      - 'lib/features/invoices/presentation/screens/invoice_details_screen.dart'
      - 'test/features/invoices/invoice_details_screen_test.dart'
      - 'test/features/invoices/mark_invoice_paid_dialog_test.dart'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invoice-details-only:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Targeted analyzer
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/features/invoices \
            test/features/invoices/invoice_details_screen_test.dart \
            test/features/invoices/mark_invoice_paid_dialog_test.dart \
            test/features/invoices/invoice_details_visual_test.dart
      - name: Invoice Details and Mark as Paid widget tests
        run: |
          flutter test --no-pub --concurrency=1 --reporter expanded --timeout 55s \
            test/features/invoices/invoice_details_screen_test.dart \
            test/features/invoices/mark_invoice_paid_dialog_test.dart
      - name: Capture Flutter render at phone and tablet sizes
        if: always()
        run: |
          flutter test --no-pub --update-goldens --reporter expanded --timeout 55s \
            test/features/invoices/invoice_details_visual_test.dart
      - name: Save Invoice Details visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invoice-details-visual-snapshots
          path: test/features/invoices/goldens/*.png
          if-no-files-found: warn
          retention-days: 7

# Final focused rerun after InvoiceRepository const constructor repair.
