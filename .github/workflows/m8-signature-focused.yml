name: M8 Digital Signatures focused Flutter verification

on:
  push:
    branches: [feature/m8-digital-signatures-2026-11-04]
    paths:
      - '.github/workflows/m8-signature-focused.yml'
      - 'lib/features/quotes/**'
      - 'test/features/quotes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign2digital-m8-flutter
  cancel-in-progress: true

jobs:
  m8-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze M8 integration and existing signing UI
        run: |
          flutter analyze --no-pub lib/features/quotes/data/remote_signature_request_repository.dart lib/features/quotes/presentation/screens/signature_request_screen.dart lib/features/quotes/presentation/screens/public_customer_signing_screen.dart lib/features/quotes/presentation/screens/customer_document_view_screen.dart lib/features/quotes/presentation/screens/quote_preview_screen.dart lib/features/quotes/domain/quote_document_tracking.dart
      - name: Verify original quote and signature screen regression
        run: flutter test --no-pub --concurrency=4 --timeout=2m --reporter=expanded test/features/quotes
