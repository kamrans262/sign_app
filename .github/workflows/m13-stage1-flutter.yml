name: M13 Stage 1 Flutter Acceptance and UI Regression
on:
  push:
    branches: [feature/m12-site-reports-meeting-minutes-2026-11-04]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign2digital-m13-stage1-flutter
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze M13 changed Flutter modules
        run: |
          dart analyze lib/features/documents/data/remote_work_acceptance_repository.dart lib/features/documents/domain/work_acceptance_data.dart lib/features/documents/presentation/screens/work_acceptance_editor_screen.dart lib/features/documents/presentation/screens/work_acceptance_screen.dart lib/features/documents/presentation/screens/reports_screen.dart lib/features/jobs/data/remote_job_repository.dart lib/features/jobs/domain/job_details_model.dart lib/features/jobs/presentation/screens/job_details_screen.dart test/features/documents/m13_remote_work_acceptance_repository_test.dart test/features/documents/work_acceptance_screen_test.dart
      - name: M13 and existing report, signing and jobs UI regression
        run: |
          flutter test --no-pub --concurrency=2 --reporter=expanded test/features/documents/m13_remote_work_acceptance_repository_test.dart test/features/documents/work_acceptance_screen_test.dart test/features/documents/reports_screen_test.dart test/features/documents/site_report_wizard_screen_test.dart test/features/documents/m12_remote_site_report_repository_test.dart test/features/jobs/m11_remote_job_media_repository_test.dart
