name: Sign2Digital Job remaining balance UI
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/qa-job-contract-balance-ui.yml'
      - 'lib/features/jobs/presentation/screens/job_details_screen.dart'
      - 'test/features/jobs/job_details_screen_test.dart'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  job-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check only modified Job Details code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/features/jobs/presentation/screens/job_details_screen.dart test/features/jobs/job_details_screen_test.dart
      - name: Job financial UI and mobile regressions
        run: timeout --signal=TERM --kill-after=10s 220s flutter test --no-pub --reporter expanded --timeout 60s test/features/jobs/job_details_screen_test.dart
