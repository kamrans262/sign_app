name: Job Photos Addenda and Signed Quote Cards QA

on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/qa-job-photos-addenda.yml'
      - 'lib/features/jobs/presentation/screens/job_details_screen.dart'
      - 'lib/features/jobs/presentation/screens/job_photos_screen.dart'
      - 'lib/features/jobs/presentation/widgets/job_addenda_bottom_sheet.dart'
      - 'lib/features/jobs/presentation/widgets/sign2digital_job_photo_card.dart'
      - 'lib/features/documents/presentation/screens/documents_screen.dart'
      - 'lib/features/documents/presentation/screens/document_details_screen.dart'
      - 'test/features/jobs/job_addenda_bottom_sheet_test.dart'
      - 'test/features/jobs/job_details_screen_test.dart'
      - 'test/features/jobs/job_photos_screen_test.dart'
      - 'test/features/documents/stage2_quote_status_integration_test.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign2digital-job-media-addenda-qa
  cancel-in-progress: true

jobs:
  job-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed screen, sheet, gallery and test files
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/features/jobs/presentation/screens/job_details_screen.dart lib/features/jobs/presentation/screens/job_photos_screen.dart lib/features/jobs/presentation/widgets/job_addenda_bottom_sheet.dart lib/features/jobs/presentation/widgets/sign2digital_job_photo_card.dart lib/features/documents/presentation/screens/documents_screen.dart lib/features/documents/presentation/screens/document_details_screen.dart test/features/jobs/job_addenda_bottom_sheet_test.dart test/features/jobs/job_details_screen_test.dart test/features/jobs/job_photos_screen_test.dart test/features/documents/stage2_quote_status_integration_test.dart
      - name: Verify Addenda bottom sheet, photo grouping, signed quote catalogue
        run: |
          flutter test --no-pub --concurrency=2 --timeout=2m --reporter=expanded test/features/jobs/job_addenda_bottom_sheet_test.dart test/features/jobs/job_details_screen_test.dart test/features/jobs/job_photos_screen_test.dart test/features/documents/stage2_quote_status_integration_test.dart
