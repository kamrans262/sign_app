name: Deposits focused verification

on:
  push:
    branches: [ui-development]
    paths:
      - '.github/workflows/deposits-one-shot-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deposits-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Check Deposits formatting and syntax
        run: dart format --output=none lib/features/deposits test/features/deposits
      - name: Analyze Deposits and only directly touched shared widgets
        run: |
          flutter analyze --no-pub lib/features/deposits test/features/deposits \
            lib/features/clients/presentation/screens/more_screen.dart \
            lib/features/clients/presentation/widgets/sign2digital_details_tabs.dart \
            lib/features/clients/presentation/widgets/sign2digital_status_badge.dart
      - name: Run Deposits listing and Create Deposit tests only
        run: |
          flutter test --no-pub --concurrency=1 --reporter expanded --timeout 45s \
            test/features/deposits/deposits_screen_test.dart \
            test/features/deposits/add_deposit_screen_test.dart
