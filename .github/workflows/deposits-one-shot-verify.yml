name: Deposits focused one-shot verification

on:
  push:
    branches:
      - ui-development
    paths:
      - '.github/workflows/deposits-one-shot-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deposits-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Deposits and directly reused components only
        run: |
          flutter analyze --no-pub             lib/features/deposits             lib/features/clients/presentation/screens/more_screen.dart             lib/features/clients/presentation/widgets/sign2digital_details_tabs.dart             lib/features/clients/presentation/widgets/sign2digital_status_badge.dart             test/features/deposits/deposits_screen_test.dart
      - name: Test Deposits screen only
        run: flutter test --no-pub --concurrency=1 --reporter expanded --timeout 45s test/features/deposits/deposits_screen_test.dart
