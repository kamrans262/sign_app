name: Deposits focused verification

on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/deposits-one-shot-verify.yml'
      - 'lib/features/deposits/**'
      - 'lib/core/widgets/sign2digital_input_field.dart'
      - 'test/features/deposits/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deposits-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Check Deposits formatting and syntax
        run: dart format --output=none lib/features/deposits test/features/deposits
      - name: Analyze Deposits and only directly touched shared widgets
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/features/deposits test/features/deposits \
            lib/core/widgets/sign2digital_input_field.dart \
            lib/features/clients/presentation/screens/more_screen.dart \
            lib/features/clients/presentation/widgets/sign2digital_details_tabs.dart \
            lib/features/clients/presentation/widgets/sign2digital_status_badge.dart
      - name: Run Deposit creation, retry, details and iOS appearance regression
        run: |
          timeout --signal=TERM --kill-after=10s 220s flutter test --no-pub --concurrency=2 --reporter expanded --timeout 60s \
            test/features/deposits/deposits_screen_test.dart \
            test/features/deposits/add_deposit_screen_test.dart \
            test/features/deposits/deposit_details_screen_test.dart \
            test/features/deposits/m16_remote_deposit_repository_test.dart \
            test/features/deposits/m16_remote_deposit_voice_test.dart

# Final Create Deposit verification after reported lint fixes.
