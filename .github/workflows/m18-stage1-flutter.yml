name: M18 Stage 1 Flutter General Documents
on:
  push:
    branches: [feature/m12-site-reports-meeting-minutes-2026-11-04]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign2digital-m18-stage1-flutter
  cancel-in-progress: true
jobs:
  general-authoring-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze document features
        run: dart analyze lib/features/documents test/features/documents
      - name: M18 API and editor regressions
        run: |
          timeout --signal=TERM --kill-after=10s 180s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/documents/m18_remote_general_document_repository_test.dart test/features/documents/m18_general_document_editor_test.dart
      - name: Original AI Documents and M9/M11 UI regression
        run: |
          timeout --signal=TERM --kill-after=10s 240s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/documents/ai_documents_screen_test.dart test/features/documents/generate_ai_document_screen_test.dart test/features/documents/documents_screen_test.dart test/features/documents/m9_remote_document_repository_test.dart test/features/jobs/convert_document_screen_test.dart
