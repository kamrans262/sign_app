name: Sign2Digital M23 app return
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/qa-m23-browser-deep-links.yml'
      - 'pubspec.yaml'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'ios/Runner/Info.plist'
      - 'lib/main.dart'
      - 'lib/features/auth/presentation/screens/company_entry_gate.dart'
      - 'lib/features/subscription/**'
      - 'test/features/subscription/m23_checkout_deep_links_test.dart'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-deep-links:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze deep link and billing views
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            lib/main.dart \
            lib/features/auth/presentation/screens/company_entry_gate.dart \
            lib/features/subscription/services/m23_billing_deep_links.dart \
            lib/features/subscription/presentation/screens/m23_checkout_return_screen.dart \
            test/features/subscription/m23_checkout_deep_links_test.dart
      - name: Test checkout callback, Stripe verification and existing flow
        run: |
          timeout --signal=TERM --kill-after=10s 260s flutter test --no-pub \
            --reporter expanded --timeout 60s \
            test/features/subscription/m23_checkout_deep_links_test.dart \
            test/features/subscription/m23_stripe_stage2_test.dart
