name: Sign2Digital focused UI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sign2digital-focused-ui.yml'
      - 'lib/features/documents/**'
      - 'lib/features/quotes/presentation/screens/add_signature_screen.dart'
      - 'lib/features/quotes/presentation/screens/in_person_signature_screen.dart'
      - 'lib/features/quotes/presentation/screens/document_signed_success_screen.dart'
      - 'lib/features/quotes/presentation/screens/quote_preview_screen.dart'
      - 'lib/features/quotes/presentation/widgets/sign2digital_signature_*.dart'
      - 'lib/features/quotes/presentation/widgets/sign2digital_quote_summary_card.dart'
      - 'lib/core/widgets/sign2digital_info_banner.dart'
      - 'lib/features/clients/presentation/screens/clients_screen.dart'
      - 'test/features/documents/**'
      - 'test/features/quotes/add_signature_screen_test.dart'
      - 'test/features/quotes/in_person_signature_screen_test.dart'
      - 'test/features/quotes/document_signed_success_screen_test.dart'
      - 'test/features/quotes/quote_preview_screen_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-flutter-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this PR
        uses: actions/checkout@v4

      - name: Install stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check Dart syntax for changed features
        run: |
          dart format --output=none \
            lib/features/documents \
            lib/features/quotes/presentation/screens/in_person_signature_screen.dart \
            lib/features/quotes/presentation/screens/add_signature_screen.dart \
            lib/features/quotes/presentation/widgets/sign2digital_quote_summary_card.dart \
            test/features/documents

      - name: Analyze only directly affected Dart files
        run: |
          flutter analyze --no-pub \
            lib/features/documents \
            lib/features/quotes/presentation/screens/in_person_signature_screen.dart \
            lib/features/quotes/presentation/screens/add_signature_screen.dart \
            lib/features/quotes/presentation/widgets/sign2digital_quote_summary_card.dart

      - name: Documents and signature focused widget tests
        run: |
          flutter test --no-pub --concurrency=1 --reporter expanded \
            test/features/documents/documents_screen_test.dart \
            test/features/documents/documents_responsive_test.dart \
            test/features/quotes/in_person_signature_screen_test.dart \
            test/features/quotes/add_signature_screen_test.dart \
            test/features/quotes/document_signed_success_screen_test.dart \
            test/features/quotes/quote_preview_screen_test.dart
