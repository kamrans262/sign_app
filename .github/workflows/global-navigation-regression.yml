name: Sign2Digital Global Navigation Regression

on:
  push:
    branches:
      - fix/m20-android-live-reminder-integration-2026-11-06
    paths:
      - '.github/workflows/global-navigation-regression.yml'
      - 'lib/core/navigation/**'
      - 'lib/core/widgets/sign2digital_bottom_navigation_bar.dart'
      - 'lib/features/**/presentation/**'
      - 'test/navigation/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2d-global-navigation
  cancel-in-progress: true

jobs:
  verify-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Isolated nested navigation regression (fail fast)
        run: timeout 85s flutter test --no-pub --concurrency=1 --timeout=40s --reporter=expanded test/navigation/global_navigation_regression_test.dart
      - name: Analyze complete app for navigation integration errors
        run: timeout 210s flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test/navigation/global_navigation_regression_test.dart
      - name: Verify duplicate taps, nested navigation and back handling
        run: timeout 210s flutter test --no-pub --concurrency=2 --timeout=50s --reporter=expanded test/navigation/global_navigation_regression_test.dart test/features/clients/clients_screen_test.dart test/features/invoices/invoices_screen_test.dart test/features/invoices/add_invoice_screen_test.dart test/features/quotes/home_signature_navigation_test.dart test/features/jobs/job_details_screen_test.dart test/features/documents/documents_screen_test.dart
