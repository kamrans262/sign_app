name: M12 Site Report Issue 21 QA

on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/qa-m12-site-report-issue21.yml'
      - 'lib/features/documents/presentation/screens/site_report_wizard_screen.dart'
      - 'lib/features/documents/presentation/screens/report_review_screen.dart'
      - 'lib/features/documents/presentation/screens/reports_screen.dart'
      - 'lib/features/documents/presentation/widgets/site_report_review_content.dart'
      - 'test/features/documents/m12_review_restoration_test.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m12-issue21
  cancel-in-progress: true

jobs:
  focused-m12:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze M12 implementation and QA
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/features/documents/presentation/screens/site_report_wizard_screen.dart lib/features/documents/presentation/screens/report_review_screen.dart lib/features/documents/presentation/screens/reports_screen.dart lib/features/documents/presentation/widgets/site_report_review_content.dart test/features/documents/m12_review_restoration_test.dart
      - name: Test original review, creation, edit, photos, statuses and API
        run: |
          flutter test --no-pub --concurrency=2 --timeout=2m --reporter=expanded test/features/documents/m12_review_restoration_test.dart test/features/documents/site_report_wizard_screen_test.dart test/features/documents/reports_screen_test.dart test/features/documents/m12_remote_site_report_repository_test.dart
