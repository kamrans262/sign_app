name: M9 Document Management focused Flutter verification

on:
  push:
    branches: [feature/m9-document-management-2026-11-04]
    paths:
      - '.github/workflows/m9-document-management.yml'
      - 'lib/features/documents/**'
      - 'test/features/documents/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign2digital-m9-flutter
  cancel-in-progress: true

jobs:
  m9-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze M9 document integration
        run: |
          flutter analyze --no-pub lib/features/documents/data/remote_document_repository.dart lib/features/documents/domain/document_record.dart lib/features/documents/presentation/screens/documents_screen.dart lib/features/documents/presentation/screens/document_details_screen.dart lib/features/documents/presentation/widgets/sign2digital_document_history.dart test/features/documents/m9_remote_document_repository_test.dart
      - name: Verify M9 and original document screens
        run: flutter test --no-pub --concurrency=4 --timeout=2m --reporter=expanded test/features/documents
