name: M17 Stage 2 Flutter Invoice Issuance
on:
  push:
    branches: [feature/m12-site-reports-meeting-minutes-2026-11-04]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign2digital-m17-stage2-flutter
  cancel-in-progress: true
jobs:
  verify-real-invoice-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze live invoice repository and existing screens
        run: dart analyze lib/features/invoices test/features/invoices
      - name: Stage 1 and Stage 2 API contract regressions
        run: |
          timeout --signal=TERM --kill-after=10s 180s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/invoices/m17_remote_invoice_repository_test.dart test/features/invoices/m17_issued_pdf_delivery_test.dart
      - name: Preserve existing invoice UI and invoice PDF preview
        run: |
          timeout --signal=TERM --kill-after=10s 240s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/invoices/invoices_screen_test.dart test/features/invoices/add_invoice_screen_test.dart test/features/invoices/invoice_details_screen_test.dart test/features/invoices/invoice_preview_screen_test.dart test/features/invoices/mark_invoice_paid_dialog_test.dart
      - name: Earlier financial regressions
        run: |
          timeout --signal=TERM --kill-after=10s 180s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/deposits/m16_remote_deposit_repository_test.dart test/features/expenses/m14_remote_expense_repository_test.dart test/features/labour/m15_remote_labour_repository_test.dart
