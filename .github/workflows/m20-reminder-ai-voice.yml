name: M20 Reminder AI Flutter
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths: ['.github/workflows/m20-reminder-ai-voice.yml', 'lib/features/reminders/**', 'test/features/reminders/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s2d-m20-reminder-ai-flutter
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: timeout 140s flutter analyze --no-pub lib/features/reminders/services/reminder_voice_extraction_service.dart lib/features/reminders/services/remote_reminder_voice_extraction_service.dart lib/features/reminders/presentation/screens/add_reminder_screen.dart test/features/reminders/m20_remote_reminder_voice_test.dart test/features/reminders/reminders_module_test.dart
      - run: timeout 190s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/reminders/m20_remote_reminder_voice_test.dart test/features/reminders/reminders_module_test.dart test/features/reminders/m20_remote_reminders_notifications_test.dart
