name: M10 Addendum Approval & Quote Preview QA

on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/qa-addendum-approval-and-quote-preview.yml'
      - 'lib/features/documents/presentation/screens/create_addendum_screen.dart'
      - 'lib/features/documents/presentation/screens/document_details_screen.dart'
      - 'lib/features/quotes/presentation/screens/quote_preview_screen.dart'
      - 'test/features/documents/addendum_approval_flow_test.dart'
      - 'test/features/documents/create_addendum_screen_test.dart'
      - 'test/features/documents/m10_addendum_responsive_test.dart'
      - 'test/features/quotes/quote_preview_screen_test.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign2digital-addendum-approval-quote-preview
  cancel-in-progress: true

jobs:
  focused-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze only affected screens and tests
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/features/documents/presentation/screens/create_addendum_screen.dart lib/features/documents/presentation/screens/document_details_screen.dart lib/features/quotes/presentation/screens/quote_preview_screen.dart test/features/documents/addendum_approval_flow_test.dart test/features/documents/create_addendum_screen_test.dart test/features/documents/m10_addendum_responsive_test.dart test/features/quotes/quote_preview_screen_test.dart
      - name: Test addendum approval, edit identity, positions and quote actions
        run: |
          flutter test --no-pub --concurrency=2 --timeout=2m --reporter=expanded test/features/documents/addendum_approval_flow_test.dart test/features/documents/create_addendum_screen_test.dart test/features/documents/m10_addendum_responsive_test.dart test/features/documents/m10_remote_addendum_repository_test.dart test/features/documents/phase5_addendum_flow_test.dart test/features/quotes/quote_preview_screen_test.dart
