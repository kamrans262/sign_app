name: M7 Quote Review Approval focused Flutter verification

on:
  push:
    branches:
      - feature/m7-quote-review-approval-2026-11-03
    paths:
      - '.github/workflows/m7-quote-focused.yml'
      - 'lib/features/quotes/**'
      - 'lib/core/services/sign_api_client.dart'
      - 'lib/features/jobs/domain/job_details_model.dart'
      - 'lib/features/jobs/data/remote_job_repository.dart'
      - 'lib/features/jobs/presentation/screens/job_details_screen.dart'
      - 'test/features/quotes/**'
  pull_request:
    branches:
      - feature/m6-ai-quote-creation-2026-11-03
    paths:
      - '.github/workflows/m7-quote-focused.yml'
      - 'lib/features/quotes/**'
      - 'test/features/quotes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign2digital-m7-flutter
  cancel-in-progress: true

jobs:
  m7-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get
      - name: Analyze M7 quote preview, generated PDF and regression tests
        run: flutter analyze --no-pub lib/core/services/sign_api_client.dart lib/features/quotes/data/remote_quote_repository.dart lib/features/quotes/domain/quote_review_models.dart lib/features/quotes/services/quote_pdf_service.dart lib/features/quotes/presentation/widgets/sign2digital_financial_document_sections.dart lib/features/quotes/services/remote_quote_preparation_service.dart lib/features/quotes/presentation/screens/create_quote_screen.dart lib/features/quotes/presentation/screens/review_quote_screen.dart lib/features/quotes/presentation/screens/send_quote_screen.dart lib/features/quotes/domain/quote_tracking_home_session.dart lib/features/jobs/data/remote_job_repository.dart lib/features/jobs/domain/job_details_model.dart lib/features/jobs/presentation/screens/job_details_screen.dart test/features/quotes/m6_remote_quote_repository_test.dart test/features/quotes/m6_stage2_privacy_and_validation_test.dart test/features/quotes/m7_quote_percent_precision_test.dart test/features/quotes/m7_quote_pdf_parity_test.dart test/features/quotes/quote_preview_screen_test.dart
      - name: Complete M7 and existing Quotes UI regression suite
        run: flutter test --no-pub --concurrency=4 --timeout=2m --reporter=expanded test/features/quotes
