name: Sign2Digital AI Support Flutter QA
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/ai-support-assistant-focused.yml'
      - 'lib/features/support/**'
      - 'lib/core/widgets/sign2digital_dashboard_header.dart'
      - 'lib/features/clients/presentation/screens/clients_screen.dart'
      - 'test/features/support/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s2d-ai-support-flutter
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze AI Support, header, navigation and test files
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/features/support lib/core/widgets/sign2digital_dashboard_header.dart lib/features/clients/presentation/screens/clients_screen.dart test/features/support
      - name: Verify AI chat and manual-only onboarding preview
        run: flutter test --no-pub --timeout=50s test/features/support/support_assistant_test.dart
