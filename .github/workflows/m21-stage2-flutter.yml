name: M21 Stage 2 Flutter Search Integration
on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign2digital-m21-stage2-flutter
  cancel-in-progress: true
jobs:
  mobile-search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze search and existing UI field integration
        run: |
          dart analyze --fatal-infos lib/features/global_search lib/core/widgets/sign2digital_search_field.dart
      - name: Search, paging, selectors, company switch and viewport regression
        run: |
          timeout --signal=TERM --kill-after=10s 250s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/global_search
      - name: Existing linked client, job and equipment module regressions
        run: |
          timeout --signal=TERM --kill-after=10s 250s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/clients/remote_client_repository_test.dart test/features/jobs/m5_remote_job_repository_test.dart test/features/equipment
