name: Stage 3 Quotation End-to-End Release Readiness

on:
  push:
    branches: [fix/m20-android-live-reminder-integration-2026-11-06]
    paths:
      - '.github/workflows/qa-quotation-stage3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign2digital-quotation-stage3-flutter
  cancel-in-progress: true

jobs:
  quotes-documents-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze quote and documents lifecycle without unrelated deprecation noise
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/features/quotes lib/features/documents lib/features/jobs
      - name: Quotation creation, approval, signing, documents and job regression
        run: |
          flutter test --no-pub --concurrency=2 --timeout=2m --reporter=expanded test/features/quotes test/features/documents test/features/jobs

  connected-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Financial module regressions (read-only tests)
        run: |
          flutter test --no-pub --concurrency=2 --timeout=2m --reporter=expanded test/features/invoices test/features/deposits test/features/expenses test/features/labour

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned test-only Android debug APK
        run: flutter build apk --debug --no-pub
      - run: test -s build/app/outputs/flutter-apk/app-debug.apk
