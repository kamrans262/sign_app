name: M16 Stage 1 Flutter Deposit Management
on:
  push:
    branches: [feature/m12-site-reports-meeting-minutes-2026-11-04]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign2digital-m16-flutter
  cancel-in-progress: true
jobs:
  deposits:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze M16 production code and deposit tests
        run: |
          dart analyze lib/features/deposits lib/features/jobs/presentation/screens/job_details_screen.dart test/features/deposits
      - name: API contracts, security and tenant isolation
        run: |
          timeout --signal=TERM --kill-after=10s 150s flutter test --no-pub --concurrency=2 --timeout=50s --reporter=expanded test/features/deposits/m16_remote_deposit_repository_test.dart
      - name: Existing deposit screens and responsive behaviour
        run: |
          timeout --signal=TERM --kill-after=10s 200s flutter test --no-pub --concurrency=2 --timeout=50s --reporter=expanded test/features/deposits/deposits_screen_test.dart test/features/deposits/add_deposit_screen_test.dart test/features/deposits/deposit_details_screen_test.dart
      - name: Job financials, previous M15 and M14 regressions
        run: |
          timeout --signal=TERM --kill-after=10s 180s flutter test --no-pub --concurrency=2 --timeout=60s --reporter=expanded test/features/jobs/job_details_screen_test.dart test/features/labour/m15_remote_labour_repository_test.dart test/features/expenses/m14_remote_expense_repository_test.dart
